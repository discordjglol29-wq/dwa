<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>zon#999 · Valorant Stats</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0c0405;--panel:#160709;--line:#ffffff4d;--red:#e1141f;--red2:#ff3b44;--text:#f6eeee;--mute:#a58d8f;--win:#3fd08a;--loss:#ff4b55;color-scheme:dark;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Barlow Condensed','Arial Narrow',Arial,sans-serif;font-size:18px;line-height:1.4}
.disp{font-family:Anton,Impact,'Arial Narrow',sans-serif;font-weight:400;letter-spacing:.01em}
nav{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 5vw;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:linear-gradient(#0c0405ee,#0c040500)}
.logo{background:var(--red);color:#fff;padding:4px 10px;border-radius:6px;font-size:20px;transform:rotate(-3deg)}
nav ul{display:flex;gap:28px;list-style:none;margin:0;padding:0}
nav a{color:var(--text);text-decoration:none;font-weight:600;font-size:15px;letter-spacing:.08em}
nav a:hover,nav a:focus-visible{color:var(--red2);outline:none}
button{font:inherit;cursor:pointer}
.btn{background:var(--red);color:#fff;border:0;padding:12px 28px;font-weight:700;letter-spacing:.1em;font-size:15px;border-radius:3px}
.btn.ghost{background:transparent;border:1px solid var(--red);color:var(--text)}
.btn:focus-visible{outline:2px solid #fff;outline-offset:2px}
.hero{position:relative;min-height:78vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 5vw 120px;overflow:hidden;
background:linear-gradient(#0c040500 55%,var(--bg))}
.hero::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,#ffffff06 0 1px,transparent 1px 64px),repeating-linear-gradient(0deg,#ffffff05 0 1px,transparent 1px 64px);mask-image:radial-gradient(circle at 50% 50%,#000 20%,transparent 75%)}
.hero h1{position:relative;margin:0;font-size:clamp(72px,19vw,260px);line-height:.95;color:#fff}
.tag{position:relative;margin:10px 0 28px;font-size:clamp(18px,2.4vw,26px);color:#ffd9db;letter-spacing:.06em}
.tag b{color:#fff}
.cta{position:relative;display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.rankbadge{position:relative;margin-top:30px;display:flex;align-items:center;gap:14px;border:1px solid var(--line);background:#0c0405cc;padding:10px 20px;border-radius:999px}
.rankbadge .dot{width:14px;height:14px;background:#fff;transform:rotate(45deg);box-shadow:0 0 14px #ffffff99}
.strip{display:flex;flex-wrap:wrap;justify-content:center;gap:0;margin:-70px 5vw 0;position:relative;z-index:2;background:#0c0405ee;border:1px solid var(--line);border-radius:10px}
.stat{flex:1 1 150px;padding:22px 18px;text-align:center;border-right:1px solid var(--line)}
.stat:last-child{border-right:0}
.stat .n{font-size:clamp(32px,4vw,46px);color:#fff;line-height:1}
.stat .l{color:var(--mute);font-size:15px;margin-top:6px}
section{padding:70px 5vw 0}
h2{font-size:clamp(34px,5vw,56px);margin:0 0 22px;color:#fff}
.grid{display:grid;grid-template-columns:2fr 1fr;gap:22px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:22px}
.card h3{margin:0 0 14px;font-size:20px;font-weight:700;color:#ffd9db}
.chart-wrap{overflow-x:auto}
svg{display:block;width:100%;height:auto;min-width:420px}
.agent{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.agent:last-child{border:0}
.bar{height:5px;background:var(--line);border-radius:3px;margin-top:5px}
.bar i{display:block;height:100%;background:var(--red);border-radius:3px}
.matches{width:100%;border-collapse:collapse;min-width:480px}
.matches th{text-align:left;color:var(--mute);font-weight:600;font-size:15px;padding:8px 10px;border-bottom:1px solid var(--line)}
.matches td{padding:12px 10px;border-bottom:1px solid var(--line)}
.w{color:var(--win);font-weight:700}.lo{color:var(--loss);font-weight:700}
footer{padding:60px 5vw 50px;color:var(--mute);display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;font-size:15px}
#ed{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;z-index:20;padding:20px}
#ed.on{display:flex}
#ed .box{background:var(--panel);border:1px solid var(--red);border-radius:10px;padding:22px;width:min(720px,100%);max-height:90vh;display:flex;flex-direction:column;gap:12px}
#ed textarea{flex:1;min-height:320px;background:#0c0405;color:#f6eeee;border:1px solid var(--line);border-radius:6px;padding:12px;font:14px/1.5 ui-monospace,Consolas,monospace;resize:vertical}
#ed p{margin:0;color:var(--mute);font-size:16px}
.row{display:flex;gap:10px;flex-wrap:wrap}
@media(max-width:760px){nav ul{display:none}.grid{grid-template-columns:1fr}.stat{border-right:0;border-bottom:1px solid var(--line)}}
@media(prefers-reduced-motion:no-preference){.hero h1{animation:rise .9s cubic-bezier(.2,.8,.2,1) both}@keyframes rise{from{opacity:0;transform:scale(.94)}}}

<header class="hero" id="top">
  <h1 class="disp">DOMINATE</h1>
  <p class="tag"><b id="pname">zon#999</b> · climbing the ladder, one round at a time</p>
  <div class="cta"><a class="btn" href="#rank" style="text-decoration:none">VIEW RANK HISTORY</a><a class="btn ghost" href="#matches" style="text-decoration:none">RECENT MATCHES</a></div>
  <div class="rankbadge"><span class="dot"></span><span class="disp" id="rankName" style="font-size:26px">—</span><span id="rankRR" style="color:var(--mute)"></span></div>
</header>

<div class="strip" id="strip"></div>

<section id="rank">
  <h2 class="disp">RANK HISTORY</h2>
  <div class="grid">
    <div class="card"><h3>Rating over time</h3><div class="chart-wrap" id="chart"></div></div>
    <div class="card"><h3 id="agents">Top agents</h3><div id="agentList"></div></div>
  </div>
</section>

<section id="matches">
  <h2 class="disp">RECENT MATCHES</h2>
  <div class="card" style="overflow-x:auto"><table class="matches"><thead><tr><th>Result</th><th>Map</th><th>Agent</th><th>Score</th><th>K / D / A</th></tr></thead><tbody id="mbody"></tbody></table></div>
</section>

<footer><span id="foot">Loading your stats…</span><span id="upd"></span></footer>

<script>
var SAMPLE={
 name:"zon#999",
 updated:"Sample data",
 stats:{kd:1.12,winrate:52,hs:24,matches:134},
 history:[{d:"Jul",elo:900},{d:"Aug",elo:1020},{d:"Sep",elo:1130},{d:"Oct 1",elo:1090},{d:"Oct 8",elo:1210},{d:"Oct 15",elo:1275},{d:"Oct 22",elo:1340}],
 agents:[{n:"Jett",games:41,wr:56},{n:"Reyna",games:28,wr:50},{n:"Omen",games:19,wr:47},{n:"Sage",games:12,wr:58}],
 matches:[{res:"W",map:"Ascent",agent:"Jett",score:"13-9",k:21,d:14,a:5},{res:"L",map:"Bind",agent:"Reyna",score:"8-13",k:15,d:18,a:3},{res:"W",map:"Haven",agent:"Jett",score:"13-11",k:24,d:16,a:2},{res:"W",map:"Lotus",agent:"Omen",score:"13-7",k:17,d:10,a:8},{res:"L",map:"Split",agent:"Jett",score:"10-13",k:19,d:17,a:4}]
};
var KEY="valo-zon-999",D=SAMPLE;

var T=["Iron","Bronze","Silver","Gold","Platinum","Diamond","Ascendant","Immortal"];
function rk(e){var i=Math.min(Math.floor(e/100),24);if(i>=24)return{n:"Radiant",rr:Math.max(0,e-2400)};return{n:T[Math.floor(i/3)]+" "+(i%3+1),rr:e%100}}
function esc(t){return String(t).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function render(){
 var h=D.history||[],cur=h.length?h[h.length-1].elo:0,r=rk(cur);
 document.getElementById("pname").textContent=D.name;
 document.getElementById("rankName").textContent=(D.current?D.current.tier:r.n).toUpperCase();
 document.getElementById("rankRR").textContent=D.current?D.current.rr+" RR":(r.n==="Radiant"?"":r.rr+" RR");
 var st=D.stats||{};
 var items=[[st.kd,"K/D ratio"],[st.winrate+"%","Win rate"],[st.hs+"%","Headshot %"],[st.matches,"Recent matches"]];
 document.getElementById("strip").innerHTML=items.map(function(x){return '<div class="stat"><div class="n disp">'+esc(x[0])+'</div><div class="l">'+x[1]+'</div></div>'}).join("");
 // chart
 var W=600,H=240,p=36,mn=Infinity,mx=-Infinity;
 h.forEach(function(q){mn=Math.min(mn,q.elo);mx=Math.max(mx,q.elo)});
 mn=Math.floor((mn-60)/100)*100;mx=Math.ceil((mx+60)/100)*100;if(mx===mn)mx=mn+100;
 var xs=function(i){return p+(h.length>1?i*(W-p*2)/(h.length-1):(W-p*2)/2)},ys=function(v){return H-p-(v-mn)*(H-p*2)/(mx-mn)};
 var g="";
 for(var v=mn;v<=mx;v+=100){g+='<line x1="'+p+'" x2="'+(W-p)+'" y1="'+ys(v)+'" y2="'+ys(v)+'" stroke="#3a0d12" stroke-width="1"/><text x="4" y="'+(ys(v)+4)+'" fill="#a58d8f" font-size="11">'+rk(v).n+'</text>'}
 var pts=h.map(function(q,i){return xs(i)+","+ys(q.elo)}).join(" ");
 var area=h.length?'<polygon points="'+xs(0)+","+(H-p)+" "+pts+" "+xs(h.length-1)+","+(H-p)+'" fill="#e1141f22"/>':"";
 var dots=h.map(function(q,i){return '<circle cx="'+xs(i)+'" cy="'+ys(q.elo)+'" r="4.5" fill="#ff3b44"><title>'+esc(q.d)+': '+esc(rk(q.elo).n)+' '+rk(q.elo).rr+' RR</title></circle><text x="'+xs(i)+'" y="'+(H-10)+'" fill="#a58d8f" font-size="11" text-anchor="middle">'+esc(q.d)+'</text>'}).join("");
 document.getElementById("chart").innerHTML='<svg viewBox="0 0 '+W+" "+H+'" role="img" aria-label="Rank rating over time">'+g+area+'<polyline points="'+pts+'" fill="none" stroke="#e1141f" stroke-width="3" stroke-linejoin="round"/>'+dots+"</svg>";
 document.getElementById("agentList").innerHTML=(D.agents||[]).map(function(a){return '<div class="agent"><div style="flex:1"><b>'+esc(a.n)+'</b> <span style="color:var(--mute)">'+esc(a.games)+' games</span><div class="bar"><i style="width:'+Math.min(100,a.wr)+'%"></i></div></div><span class="disp" style="font-size:24px;margin-left:16px">'+esc(a.wr)+'%</span></div>'}).join("");
 document.getElementById("mbody").innerHTML=(D.matches||[]).map(function(m){return '<tr><td class="'+(m.res==="W"?"w":"lo")+'">'+(m.res==="W"?"Win":"Loss")+"</td><td>"+esc(m.map)+"</td><td>"+esc(m.agent)+"</td><td>"+esc(m.score)+"</td><td>"+esc(m.k)+" / "+esc(m.d)+" / "+esc(m.a)+"</td></tr>"}).join("");
 document.getElementById("upd").textContent=D.updated||"";
}
function load(){var f=document.getElementById("foot");
 fetch("/api/stats").then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(o){D=o;render();f.textContent="Live from your match history. Refresh the page after you play."}).catch(function(){f.textContent="Couldn’t load your live stats. Showing sample numbers."})}
render();load();
</script>
